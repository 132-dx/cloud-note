<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云端同步笔记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4f6f8;padding:16px;max-width:920px;margin:0 auto;font-family:system-ui}
#lockArea{display:flex;gap:8px;margin-bottom:12px}
#pw{flex:1;padding:10px;font-size:16px}
#btnUnlock{padding:10px 18px;cursor:pointer}
#main{display:none}
#txt{width:100%;min-height:75vh;padding:14px;font-size:16px;border:1px solid #bbb;border-radius:8px;resize:vertical;white-space:pre-wrap}
.tip{margin:8px 0;color:#666;font-size:14px}
</style>
</head>
<body>
<div id="lockArea">
<input id="pw" placeholder="输入访问密码">
<button id="btnUnlock">解锁云端笔记</button>
</div>

<div id="main">
<div class="tip">自动保存，手机电脑打开此网址全部同步</div>
<textarea id="txt" placeholder="在这里写笔记..."></textarea>
</div>

<script>
let baseUrl = location.origin;
let pass="";
const lockArea = document.getElementById("lockArea");
const main = document.getElementById("main");
const pwEl = document.getElementById("pw");
const unlockBtn = document.getElementById("btnUnlock");
const txtEl = document.getElementById("txt");
let saveTimer=null;

unlockBtn.onclick = async ()=>{
  pass = pwEl.value.trim();
  const res = await fetch(`${baseUrl}/api/note?pwd=${encodeURIComponent(pass)}`);
  const data = await res.json();
  if(!data.ok){alert(data.msg);return;}
  lockArea.style.display="none";
  main.style.display="block";
  txtEl.value = data.content;
}

//自动保存到云端
txtEl.oninput = ()=>{
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    await fetch(`${baseUrl}/api/note`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pwd:pass,text:txtEl.value})
    })
  },800)
}
</script>
</body>
</html>
